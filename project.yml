name: FizyoKantik
options:
  bundleIdPrefix: com.fizyokantik
  xcodeVersion: "16.0"
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: "NO"
    DEVELOPMENT_TEAM: "ZM6KU52XKM"

targets:
  FizyoKantik:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    scheme: {}
    sources:
      - path: FizyoKantik
        excludes:
          - "Config/Info.plist"
    settings:
      base:
        PRODUCT_NAME: FizyoKantik
        PRODUCT_BUNDLE_IDENTIFIER: com.fizyokantik.app
        INFOPLIST_FILE: FizyoKantik/Config/Info.plist
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: "ZM6KU52XKM"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO


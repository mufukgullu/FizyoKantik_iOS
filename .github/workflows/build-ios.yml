name: iOS Build & TestFlight

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Deploy iOS
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Verify Swift Compilation (Validation)
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project FizyoKantik.xcodeproj \
            -scheme FizyoKantik \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee build.log || (echo "=== DERLEME HATALARI ===" && grep -i -E "error:" build.log && exit 1)

      - name: Setup App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APPSTORE_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8

      - name: Build Archive & Upload to TestFlight
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          fastlane beta

      - name: Upload Artifact (Yedek IPA / Build Çıktısı)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FizyoKantik-iOS-Build
          path: |
            build/
            FizyoKantik.xcodeproj
          if-no-files-found: ignore

